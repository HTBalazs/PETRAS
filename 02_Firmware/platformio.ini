; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    mathieucarbou/ESP Async WebServer@2.10.8 ; ESP Async WebServer library for Wi-Fi communication
    WebSockets ; WebSockets library for broadcasting measurement data through a Wi-Fi web server
    ICM42670P ; Library for the ICM-42670-P sens
    xreef/SimpleFTPServer @ 3.0.1
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:esp32-s3-devkitm-1-USB]
upload_protocol = esptool
;upload_port = /dev/cu.usbmodem2101

[env:esp32-s3-devkitm-1-OTA]
upload_protocol = espota
upload_port = PETRAS.local